name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SKILL.md frontmatter 合法（第一行必须是裸 ---）
        run: |
          set -e
          head -n 1 SKILL.md | grep -qx -- '---' || { echo "::error::SKILL.md 第一行必须是裸 ---"; exit 1; }
          if grep -n '^\\---' SKILL.md; then
            echo "::error::frontmatter 被转义成 \\---，宿主会静默忽略整条技能"; exit 1
          fi
          name=$(sed -n '2s/^name:[[:space:]]*//p' SKILL.md | tr -d '\r')
          echo "skill name: $name"
          echo "$name" | grep -Eq '^[a-z0-9]+(-[a-z0-9]+)*$' \
            || { echo "::error::name 必须匹配 ^[a-z0-9]+(-[a-z0-9]+)*$（中文名放 metadata.displayName）"; exit 1; }
          grep -q '^description:' SKILL.md || { echo "::error::缺 description"; exit 1; }

      - name: 常驻卡标记存在且非空
        run: |
          set -e
          grep -q 'AIW_CORE:START' SKILL.md
          grep -q 'AIW_CORE:END' SKILL.md
          core=$(sed -n '/AIW_CORE:START/,/AIW_CORE:END/p' SKILL.md | wc -l)
          echo "常驻卡行数：$core"
          [ "$core" -le 16 ] || { echo "::error::常驻卡超过 16 行硬顶（12 内容行 + 2 标记 + 2 标题，v2.5.0 反变笨瘦身）"; exit 1; }
          # 关键闸门不许被删（R0 输入闸门 / 成本上限 / 单条命令 20 秒）—— 都是按真实事故加的
          grep -q '第 0 条' SKILL.md || { echo "::error::常驻卡缺 R0 输入闸门（一句话：没有对象+动作时先问，禁止先搜索）"; exit 1; }
          grep -q '20 秒' SKILL.md || { echo "::error::缺单条命令 20 秒成本上限"; exit 1; }
          grep -q '禁止从' SKILL.md || { echo "::error::缺'禁止从盘符根递归'"; exit 1; }
          grep -q '输入闸门' SKILL.md || { echo "::error::正文缺 R0 输入闸门章节"; exit 1; }
          # v2.4.0 的智商层三条闸门 + 两条既有行增强，同样不许被静默删掉
          grep -q 'REANCHOR' SKILL.md || { echo "::error::缺 R15 压缩/接管后重锚（REANCHOR）"; exit 1; }
            grep -q 'UNVERIFIED' SKILL.md || { echo "::error::缺 R16 交付对账（UNVERIFIED 如实标注）"; exit 1; }
            grep -q '最小可验证切片' SKILL.md || { echo "::error::缺 R8 想清才动手（最小可验证切片）"; exit 1; }
            grep -q '交付即产物' SKILL.md || { echo "::error::缺 R17 交付即产物"; exit 1; }
            grep -q '扫描/枚举/全盘/句柄类硬上限 20 秒' SKILL.md || { echo "::error::缺扫描/枚举类 20 秒硬上限（v2.10.0 句柄枚举 240 秒事故）"; exit 1; }
            grep -q '`wait=true` 只准等 1 次' SKILL.md || { echo "::error::缺后台 Job 单次等待上限（v2.10.0 两次 wait 干等前事故）"; exit 1; }
            grep -q '连续 5 步没有对外文字' SKILL.md || { echo "::error::缺静默上限（v2.10.0 16 步 0 输出事故）"; exit 1; }
            grep -q '空转' SKILL.md || { echo "::error::缺 R4 空转熔断"; exit 1; }
          for f in references/iq-reasoning.md references/iq-nolazy.md references/iq-ledger.md references/iq-taste.md references/iq-models-cn.md references/iq-models-intl.md; do
            [ -s "$f" ] || { echo "::error::按需层文档缺失或为空：$f"; exit 1; }
          done

      - name: 编码与行尾
        run: |
          set -e
          if grep -rlU $'\r' install.sh activate.cmd 2>/dev/null | grep -q install.sh; then
            echo "::error::install.sh 含 CRLF，Linux/macOS 会报 bad interpreter"; exit 1
          fi
          head -c 3 install.ps1 | xxd -p | grep -qi '^efbbbf$' \
            || { echo "::error::install.ps1 必须是 UTF-8 with BOM（PowerShell 5.1 解析中文需要）"; exit 1; }
          head -c 3 eval/run.ps1 | xxd -p | grep -qi '^efbbbf$' \
            || { echo "::error::eval/run.ps1 必须是 UTF-8 with BOM"; exit 1; }

      - name: 评测器械自检（探针 JSON + 打分器语法）
        shell: pwsh
        run: |
          $j = Get-Content "$PWD/eval/probes.json" -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($j.probes.Count -lt 10) { throw "探针少于 10 条（现在 $($j.probes.Count)）" }
          $sum = ($j.probes | Measure-Object points -Sum).Sum
          if ($sum -ne ($j.probes.Count * 2)) { throw "每条探针应为 2 分，当前合计 $sum" }
          foreach ($p in $j.probes) {
            foreach ($k in 'id', 'dim', 'title', 'prompt', 'pass', 'fail') {
              if (-not $p.$k) { throw "探针 $($p.id) 缺字段 $k" }
            }
          }
          $e = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/eval/run.ps1", [ref]$null, [ref]$e)
          if ($e -and $e.Count) { $e | ForEach-Object { Write-Error $_.Message }; exit 1 }
          "eval self-test ok: $($j.probes.Count) 条探针 / 满分 $sum"

      - name: bash 语法
        run: bash -n install.sh

      - name: PowerShell 语法
        shell: pwsh
        run: |
          $e = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$e)
          if ($e -and $e.Count) { $e | ForEach-Object { Write-Error $_.Message }; exit 1 }
          "parse ok"

      - name: 安装脚本自测（全局：幂等 + 卸载还原 + 不越界）
        shell: pwsh
        run: |
          $t = Join-Path ([IO.Path]::GetTempPath()) ("aiw-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Force -Path (Join-Path $t ".codex") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $t ".trae/user_rules") | Out-Null   # Trae 已证实的全局规则目录
          New-Item -ItemType Directory -Force -Path (Join-Path $t ".lingma") | Out-Null            # 只有 skills，不该建 rules
          $f = Join-Path $t ".codex/AGENTS.md"
          [IO.File]::WriteAllText($f, "# user content`n", (New-Object Text.UTF8Encoding($false)))
          & ./install.ps1 -Root $t | Out-Null
          if ((Select-String -Path $f -Pattern 'ai-work-doctor:start' -SimpleMatch).Count -ne 1) { throw "注入次数不对" }
          if (-not (Test-Path (Join-Path $t ".trae/user_rules/ai-work-doctor.md"))) { throw "Trae 全局规则没写入" }
          if (Test-Path (Join-Path $t ".lingma/rules")) { throw "给未证实路径创建了目录" }
          $h1 = (Get-FileHash $f).Hash
          & ./install.ps1 -Root $t | Out-Null
          if ((Get-FileHash $f).Hash -ne $h1) { throw "非幂等：重复运行改变了文件" }
          & ./install.ps1 -Root $t -Uninstall | Out-Null
          if ((Get-Content $f -Raw).Trim() -ne "# user content") { throw "卸载没有还原用户内容" }
          if (Test-Path (Join-Path $t ".trae/user_rules/ai-work-doctor.md")) { throw "卸载没删掉写入的文件" }
          "global self-test ok"

      - name: 安装脚本自测（按 agent 单独安装 / 单独卸载）
        shell: pwsh
        run: |
          $t = Join-Path ([IO.Path]::GetTempPath()) ("aiws-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Force -Path (Join-Path $t ".codex") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $t ".dsh")   | Out-Null
          & ./install.ps1 -Root $t -Only codex | Out-Null
          if (-not (Test-Path (Join-Path $t ".codex/AGENTS.md"))) { throw "点名 codex 却没写" }
          if (Test-Path (Join-Path $t ".dsh/AGENTS.md")) { throw "点名 codex 却动了 dsh" }
          & ./install.ps1 -Root $t -Only codex -Uninstall | Out-Null
          if (Test-Path (Join-Path $t ".codex/AGENTS.md")) { throw "按 agent 卸载没生效" }
          & ./install.ps1 -Root $t -Only trae -DryRun | Out-Null   # 不存在的宿主：-DryRun 不该落盘
          if (Test-Path (Join-Path $t ".trae")) { throw "-DryRun 竟然写了文件" }
          "per-agent self-test ok"

      - name: 安装脚本自测（项目级：写入 + frontmatter + 幂等 + 卸载干净）
        shell: pwsh
        run: |
          $p = Join-Path ([IO.Path]::GetTempPath()) ("aiwp-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Force -Path $p | Out-Null
          & ./install.ps1 -Project $p | Out-Null
          foreach ($rel in @(
            "AGENTS.md", "CODEBUDDY.md", "CONVENTIONS.md",
            ".trae/rules/ai-work-doctor.md", ".cursor/rules/ai-work-doctor.mdc",
            ".comate/rules/ai-work-doctor.mdr", ".codebuddy/rules/ai-work-doctor/RULE.mdc",
            ".lingma/rules/ai-work-doctor.md", ".qoder/rules/ai-work-doctor.md",
            ".github/instructions/ai-work-doctor.instructions.md")) {
            if (-not (Test-Path (Join-Path $p $rel))) { throw "项目级没写入 $rel" }
          }
          $mdc = Get-Content (Join-Path $p ".cursor/rules/ai-work-doctor.mdc") -Raw
          if (-not $mdc.StartsWith("---")) { throw ".mdc 缺 frontmatter，Cursor 不会加载" }
          $lingma = Get-Content (Join-Path $p ".lingma/rules/ai-work-doctor.md") -Raw
          if ($lingma -notmatch 'trigger:\s*always_on') { throw "Qoder CN IDE 规则缺 trigger: always_on" }
          $h = (Get-FileHash (Join-Path $p "AGENTS.md")).Hash
          & ./install.ps1 -Project $p | Out-Null
          if ((Get-FileHash (Join-Path $p "AGENTS.md")).Hash -ne $h) { throw "项目级非幂等" }
          & ./install.ps1 -Project $p -Uninstall | Out-Null
          if ((Get-ChildItem -LiteralPath $p -Recurse -File).Count -ne 0) { throw "项目级卸载没清干净" }
          "project self-test ok"
      - name: 评审器自测 + 审计自己的常驻卡
        shell: pwsh
        run: |
          # 只断言「输出里的结论」，不依赖 $LASTEXITCODE（& script.ps1 不会可靠设置它，第一次就是这么红掉的）
          # 断言只认 ASCII 结论行：runner 会把内联步骤写成无 BOM 的临时 .ps1，中文串会被按 ANSI 解码
          $a = & ./eval/card-audit.ps1 -SelfTest 6>&1 | Out-String
          if ($a -notmatch 'SELFTEST: PASS') { throw 'card-audit self-test failed: the judge itself is not trustworthy' }
          $b = & ./eval/scan.ps1 -SelfTest 6>&1 | Out-String
          if ($b -notmatch 'SELFTEST: PASS') { throw 'scan self-test failed: the judge itself is not trustworthy' }
          $f = & ./eval/friction.ps1 -SelfTest 6>&1 | Out-String
          if ($f -notmatch 'SELFTEST: PASS') { throw 'friction self-test failed: the judge itself is not trustworthy' }
          $d = & ./eval/card-audit.ps1 6>&1 | Out-String
          if ($d -notmatch 'ERRORS: 0') { throw 'card audit reported errors (missing caps / over 30 lines / code block inside card)' }
          "judges self-test + card audit ok"
      - name: 能力夹具自检（capability fixtures）
        shell: pwsh
        run: |
          & ./eval/cap-fixture.ps1 | Out-Null
          $a = & ./eval/cap-fixture.ps1 -Verify 6>&1 | Out-String
          if ($a -notmatch 'FIXTURE: OK') { throw 'cap fixture self-check failed' }
          $b = & ./eval/cap-gate.ps1 -SelfTest 6>&1 | Out-String
          if ($b -notmatch 'SELFTEST: PASS') { throw 'cap-gate self-test failed' }
          'cap gates ok'
      - name: 会话体检器自测（session-audit）
        shell: pwsh
        run: |
          $o = & ./eval/session-audit.ps1 -SelfTest 6>&1 | Out-String
          if ($o -notmatch 'SELFTEST: PASS') { throw 'session-audit self-test failed' }
          'session audit ok'